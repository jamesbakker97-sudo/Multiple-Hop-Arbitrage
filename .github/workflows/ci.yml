name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          default: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests
        working-directory: ./rust-core
        run: cargo test --manifest-path Cargo.toml --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install control-plane dependencies
        run: npm --prefix control-plane ci

      - name: Build control-plane (TypeScript)
        run: npm --prefix control-plane run build

      - name: Build contracts (optional)
        run: npm run build:contracts
        continue-on-error: true

      - name: Run root tests (contracts/JS if any)
        run: npm test || true

  image:
    name: Build Docker images & scan
    runs-on: ubuntu-latest
    needs: build
    env:
      IMAGE_RUST: rust-core:${{ github.sha }}
      IMAGE_CONTROL_PLANE: control-plane:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build rust-core (release)
        run: |
          cd rust-core
          cargo build --release --locked

      - name: Create rust Dockerfile
        run: |
          cat > rust-core/Dockerfile.ci <<'EOF'
          FROM debian:bookworm-slim
          COPY rust-core/target/release/rust-core /usr/local/bin/rust-core
          RUN chmod +x /usr/local/bin/rust-core
          ENTRYPOINT ["/usr/local/bin/rust-core"]
          EOF

      - name: Build rust-core image
        run: docker build -f rust-core/Dockerfile.ci -t $IMAGE_RUST .

      - name: Create control-plane Dockerfile
        run: |
          cat > control-plane/Dockerfile.ci <<'EOF'
          FROM node:18-alpine
          WORKDIR /app
          COPY control-plane/package.json control-plane/package-lock.json ./
          COPY control-plane/dist ./dist
          CMD ["node", "dist/index.js"]
          EOF

      - name: Build control-plane image
        run: docker build -f control-plane/Dockerfile.ci -t $IMAGE_CONTROL_PLANE .

      - name: Scan rust image with Trivy
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          image-ref: ${{ env.IMAGE_RUST }}

      - name: Scan control-plane image with Trivy
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          image-ref: ${{ env.IMAGE_CONTROL_PLANE }}
