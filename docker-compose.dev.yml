version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Example: you can run the remote signer locally and connect to Redis from the control-plane
  # remote-signer:
  #   build: ./examples/remote-signer
  #   environment:
  #     - SIGNER_PRIVATE_KEY
  #   ports:
  #     - "3001:3001"
